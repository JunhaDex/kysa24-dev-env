server {
    listen 8081;
    listen [::]:8081;
    server_name _;
    gzip on;

    # Health check endpoint
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'healthy!';
    }

    # Redirect root to the specific path
    location = / {
        return 301 $scheme://$http_host/2024-mate-c4e8f9cd05654a4481352bd5ccb7823e;
    }

    # Proxy all other paths to Notion
    location / {
        proxy_pass https://abundant-laser-136.notion.site;
        proxy_set_header Host abundant-laser-136.notion.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Use $http_host to preserve the original requested host
        proxy_set_header X-Forwarded-Host $http_host;

        # Preserve the original path when proxying
        proxy_set_header X-Forwarded-Path $request_uri;

        # SSL specific settings
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_ciphers HIGH:!aNULL:!MD5;

        # Additional proxy settings
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Increase timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
